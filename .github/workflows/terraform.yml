name: terraform

on:
  # Les contrôles tournent sur chaque PR : aucun login Azure, aucun coût.
  pull_request:
  # Le déploiement (plan puis apply) est déclenché à la main uniquement,
  # jamais par un merge sur main.
  workflow_dispatch:

permissions:
  id-token: write   # OIDC vers Azure
  contents: read

env:
  RG_NAME: msaidiRG
  OWNER_TAG: mohamed-saidi
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # --- Contrôles qualité + sécurité ------------------------------------------
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init (sans backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      # tfsec n'est plus maintenu, Trivy a repris ses checks (mêmes AVD-...).
      # HIGH et CRITICAL bloquent (exit 1). MEDIUM est informatif : ce sont
      # des compromis non-prod assumés (accès public PostgreSQL filtré par
      # firewall, ADR 0001), listés dans le résumé du job sans bloquer.
      - name: Scan IaC bloquant (Trivy, HIGH et CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan IaC informatif (Trivy, MEDIUM)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: MEDIUM
          exit-code: "0"
          format: table
          output: trivy-medium.txt

      - name: Résumé Trivy
        if: always()
        run: |
          {
            echo '### Trivy MEDIUM (informatif)'
            echo '```'
            cat trivy-medium.txt 2>/dev/null || echo 'aucun résultat'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Détection de secrets (gitleaks)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --redact -v

  # --- Plan : lisible dans les logs avant l'apply -----------------------------
  plan:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
      # Le provider kubernetes s'authentifie via un bloc exec appelant
      # kubelogin, absent des runners GitHub.
      - name: Installer kubelogin
        run: |
          curl -sSLO https://github.com/Azure/kubelogin/releases/latest/download/kubelogin-linux-amd64.zip
          unzip -q kubelogin-linux-amd64.zip
          sudo mv bin/linux_amd64/kubelogin /usr/local/bin/
      # Le Key Vault et le storage sont fermés par défaut : on ouvre le firewall
      # à l'IP du runner avant terraform init (ADR 0004).
      - name: Ouvrir les firewalls (JIT)
        uses: ./.github/actions/jit-firewall
        with:
          mode: open
          resource-group: ${{ env.RG_NAME }}
          owner: ${{ env.OWNER_TAG }}
      - run: terraform init
      - run: terraform plan
        env:
          TF_VAR_ci_principal_id: ${{ secrets.TF_VAR_ci_principal_id }}

      - name: Fermer les firewalls
        if: always()
        uses: ./.github/actions/jit-firewall
        with:
          mode: close
          resource-group: ${{ env.RG_NAME }}
          owner: ${{ env.OWNER_TAG }}

  # --- Apply : seulement si checks et plan sont passés ------------------------
  apply:
    if: github.event_name == 'workflow_dispatch'
    needs: [checks, plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
      # Le provider kubernetes s'authentifie via un bloc exec appelant
      # kubelogin, absent des runners GitHub.
      - name: Installer kubelogin
        run: |
          curl -sSLO https://github.com/Azure/kubelogin/releases/latest/download/kubelogin-linux-amd64.zip
          unzip -q kubelogin-linux-amd64.zip
          sudo mv bin/linux_amd64/kubelogin /usr/local/bin/
      # Le Key Vault et le storage sont fermés par défaut : on ouvre le firewall
      # à l'IP du runner avant terraform init (ADR 0004).
      - name: Ouvrir les firewalls (JIT)
        uses: ./.github/actions/jit-firewall
        with:
          mode: open
          resource-group: ${{ env.RG_NAME }}
          owner: ${{ env.OWNER_TAG }}
      - run: terraform init
      - run: terraform apply -auto-approve
        env:
          TF_VAR_ci_principal_id: ${{ secrets.TF_VAR_ci_principal_id }}

      - name: Fermer les firewalls
        if: always()
        uses: ./.github/actions/jit-firewall
        with:
          mode: close
          resource-group: ${{ env.RG_NAME }}
          owner: ${{ env.OWNER_TAG }}
