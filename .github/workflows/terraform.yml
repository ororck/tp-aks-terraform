name: terraform

on:
  # Contrôles qualité et sécurité avant merge
  pull_request:
    branches: [main]
  # Déploiement de l'infra une fois le code sur main
  push:
    branches: [main]
  # Relance manuelle du déploiement sans nouveau commit
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        default: "nonprod"
        type: string

permissions:
  id-token: write      # OIDC vers Azure
  contents: read
  pull-requests: write # commentaire de plan

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # --- Contrôles qualité + sécurité : uniquement sur PR ----------------------
  # Le code arrivant sur main est déjà passé par ici, inutile de rescanner.
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks compare le commit à son parent : il lui faut l'historique.
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init (sans backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Scan IaC (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3

      - name: Détection de secrets (gitleaks)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --redact -v

  # --- Plan sur PR -----------------------------------------------------------
  plan:
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan
        env:
          TF_VAR_ci_principal_id: ${{ secrets.TF_VAR_ci_principal_id }}

  # --- Apply : sur main, ou relance manuelle ---------------------------------
  # Pas de "needs: checks" : sur main le job checks n'existe pas.
  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: nonprod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform apply -auto-approve
        env:
          TF_VAR_ci_principal_id: ${{ secrets.TF_VAR_ci_principal_id }}